<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-serif, Georgia, 'Times New Roman', serif">
  <!-- Original illustration for the DarkSide Lean project. CC0 / public domain. -->
  <defs>
    <linearGradient id="whiteBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a3a"/>
      <stop offset="1" stop-color="#16161f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#0a0a12"/>

  <!-- title -->
  <text x="60" y="70" fill="#f2f2f5" font-size="34" font-weight="600">A prism is a Fourier transform</text>
  <text x="60" y="102" fill="#9aa0b4" font-size="18">white light &#8801; &#931;<tspan baseline-shift="sub" font-size="12">k</tspan> a<tspan baseline-shift="sub" font-size="12">k</tspan> cos(&#969;<tspan baseline-shift="sub" font-size="12">k</tspan> t + &#966;<tspan baseline-shift="sub" font-size="12">k</tspan>)  &#8594;  the screen shows |&#202;(&#969;)|&#178; = a<tspan baseline-shift="sub" font-size="12">k</tspan>&#178;</text>

  <!-- input signal box: a real sum-of-cosines waveform -->
  <g>
    <text x="60" y="168" fill="#9aa0b4" font-size="15" font-style="italic">input: E(t) at the prism</text>
    <rect x="60" y="180" width="250" height="96" fill="none" stroke="#3a3a4a" stroke-width="1"/>
    <path d="M60 228
             Q 72 200 84 228 T 108 228 Q 118 250 130 214 T 156 236
             Q 168 204 180 232 T 206 224 Q 218 252 230 214 T 256 234
             Q 268 206 280 230 T 306 226"
          fill="none" stroke="#e8e8ee" stroke-width="1.6" filter="url(#soft)"/>
    <text x="185" y="298" fill="#6b7288" font-size="13">t &#8594;</text>
  </g>

  <!-- incoming white beam -->
  <line x1="120" y1="470" x2="470" y2="352" stroke="url(#whiteBeam)" stroke-width="7" stroke-linecap="round"/>

  <!-- the prism -->
  <polygon points="560,150 452,430 668,430" fill="url(#glass)" stroke="#4a4a5e" stroke-width="1.5"/>
  <text x="560" y="392" fill="#6b7288" font-size="15" text-anchor="middle">glass, n(&#969;)</text>

  <!-- dispersed spectral rays: exit face to spectrum bars -->
  <!-- red low-omega (bends least) ... violet high-omega (bends most) -->
  <g stroke-width="4.5" stroke-linecap="round" opacity="0.95">
    <line x1="612" y1="356" x2="892" y2="262" stroke="#ff4d4d"/>
    <line x1="612" y1="358" x2="892" y2="290" stroke="#ff9f40"/>
    <line x1="612" y1="360" x2="892" y2="318" stroke="#ffe14d"/>
    <line x1="612" y1="362" x2="892" y2="346" stroke="#4ddb6a"/>
    <line x1="612" y1="364" x2="892" y2="374" stroke="#4da6ff"/>
    <line x1="612" y1="366" x2="892" y2="402" stroke="#4d6bff"/>
    <line x1="612" y1="368" x2="892" y2="430" stroke="#a64dff"/>
  </g>

  <!-- the screen: spectrum bars, length = a_k^2 -->
  <line x1="896" y1="238" x2="896" y2="456" stroke="#3a3a4a" stroke-width="1.5"/>
  <text x="900" y="228" fill="#9aa0b4" font-size="15">screen: |&#202;(&#969;)|&#178;</text>
  <g>
    <rect x="900" y="255" width="104" height="15" fill="#ff4d4d"/>
    <rect x="900" y="283" width="92"  height="15" fill="#ff9f40"/>
    <rect x="900" y="311" width="150" height="15" fill="#ffe14d"/>
    <rect x="900" y="339" width="190" height="15" fill="#4ddb6a"/>
    <rect x="900" y="367" width="118" height="15" fill="#4da6ff"/>
    <rect x="900" y="395" width="84"  height="15" fill="#4d6bff"/>
    <rect x="900" y="423" width="58"  height="15" fill="#a64dff"/>
  </g>
  <text x="1010" y="252" fill="#8a90a4" font-size="13">red, low &#969;</text>
  <text x="1010" y="447" fill="#8a90a4" font-size="13">violet, high &#969;</text>

  <!-- footer: tie to the theorems -->
  <text x="60" y="628" fill="#6b7288" font-size="14" font-style="italic">Each color k is the real part of a rotating phasor c<tspan baseline-shift="sub" font-size="10">k</tspan> e<tspan baseline-shift="super" font-size="10">i&#969;<tspan baseline-shift="sub" font-size="8">k</tspan>t</tspan>; its bar length is &#8214;c<tspan baseline-shift="sub" font-size="10">k</tspan>&#8214;&#178; = a<tspan baseline-shift="sub" font-size="10">k</tspan>&#178;. Formalized in Lean 4 + Mathlib.</text>
</svg>
